# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/interactive/playthrough.v1.schema.json
# The plain game, seed 1: pause and resume, one throw and one field in each of the six rounds, the end, and the next
# game. The plain game gives no advice.
route: spielen
seed: 1
steps:
  # the short game
  - inputs: [{ kind: action, name: size, value: 6 }]
    state: { phase: "play", size: 6 }
  # pause, and on
  - inputs: [{ kind: action, name: pause }]
    state: { phase: "paused" }
  - keys: ["Escape"]
    state: { phase: "play" }
  # a round: throw once and enter a field; no advice in the plain game
  - keys: ["r"]
    state: { round: 1, dice: [4, 1, 4, 6, 6], rollsLeft: 2, advice: null }
  - inputs: [{ kind: action, name: score, value: "ones" }]
    state: { round: 2, total: 1 }
  - keys: ["r"]
    state: { round: 2, dice: [2, 4, 5, 3, 6], rollsLeft: 2, advice: null }
  - inputs: [{ kind: action, name: score, value: "twos" }]
    state: { round: 3, total: 3 }
  - keys: ["r"]
    state: { round: 3, dice: [3, 3, 1, 3, 2], rollsLeft: 2, advice: null }
  - inputs: [{ kind: action, name: score, value: "threes" }]
    state: { round: 4, total: 12 }
  - keys: ["r"]
    state: { round: 4, dice: [1, 3, 1, 3, 5], rollsLeft: 2, advice: null }
  - inputs: [{ kind: action, name: score, value: "fours" }]
    state: { round: 5, total: 12 }
  - keys: ["r"]
    state: { round: 5, dice: [2, 2, 1, 3, 4], rollsLeft: 2, advice: null }
  - inputs: [{ kind: action, name: score, value: "fives" }]
    state: { round: 6, total: 12 }
  - keys: ["r"]
    state: { round: 6, dice: [5, 2, 2, 4, 4], rollsLeft: 2, advice: null }
  - inputs: [{ kind: action, name: score, value: "sixes" }]
    state: { phase: "done", total: 12, upper: 12, bonus: 0 }
  # another game
  - inputs: [{ kind: action, name: again }]
    state: { phase: "setup", size: 6, total: 0, round: 1 }
